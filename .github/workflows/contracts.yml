name: contracts

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check TS / JSON Schema / Pydantic parity
        run: node scripts/check-contract-parity.mjs
