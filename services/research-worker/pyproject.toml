[project]
name = "chengsi-research-worker"
version = "0.1.0"
description = "澄思学术 Python Sidecar：Agent、模型适配、来源检索、解析、实验与报告"
requires-python = ">=3.13,<3.14"
dependencies = [
  "cers-contracts",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.4,<3",
  "python-docx>=1.2.0",
  "reportlab>=5.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
]

[tool.uv.sources]
cers-contracts = { path = "../../packages/contracts/python", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]

[tool.hatch.build.targets.wheel]
packages = ["chengsi_worker"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
